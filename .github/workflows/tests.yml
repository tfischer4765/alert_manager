name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The sanity check compares against earlier tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install pytest-homeassistant-custom-component ruff
      - name: Sanity check
        run: python scripts/sanity_check.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
