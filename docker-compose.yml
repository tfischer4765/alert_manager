services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: alert-manager-ha
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./dev/config:/config
      - ./custom_components/alert_manager:/config/custom_components/alert_manager:ro
